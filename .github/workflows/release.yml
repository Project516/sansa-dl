name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"/\1/p' Cargo.toml | head -1)
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read a major.minor version from Cargo.toml"
            exit 1
          fi
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    if: github.ref == 'refs/heads/master'
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    if: github.ref == 'refs/heads/master'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clipplus-manager-appimage
          path: dist

      - name: Create the release
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$previous" ]; then range="$previous..HEAD"; else range="HEAD"; fi
          git log "$range" --no-merges --format='- %s' > notes.md
          gh release create "v$VERSION" dist/*.AppImage dist/*.AppImage.sha256 \
            --title "v$VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
