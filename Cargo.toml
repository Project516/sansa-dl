[workspace]
members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Project516/sansa-dl"
publish = false

[package]
name = "sansa-dl"
description = "Download audio from links and copy it to a SanDisk Sansa Clip+"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sansa-dl-core = { path = "core" }
cxx = "1.0.205"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
cxx-qt-lib-extras = "0.10"
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
lto = "thin"
strip = true
